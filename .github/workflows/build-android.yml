# Android wheel builds.
#
# Manual dispatch only: these builds are slow and their inputs change rarely,
# so there is nothing useful to trigger on push.
#
# With `publish` set, the run also creates the GitHub Release and republishes the
# index. That is deliberate: the point of this repo is that a wheel's whole path
# from source to index is reproducible, and a wheel that CI builds but a human
# downloads and uploads has a laptop in the middle of that path.
name: build-android

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which recipe to build
        required: true
        type: choice
        options: [sdl2, sdl3, kivy-2.3.1-sdl2, kivy-3.0-sdl3, pyjnius]
      publish:
        description: Publish a release from the built wheels and update the index
        required: false
        default: false
        type: boolean
      replace_assets:
        description: >-
          Overwrite assets already attached to the release. Changes their
          sha256, so every existing lock file that pins them breaks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7

      # The recipes `pip install` cibuildwheel and Cython. ubuntu-latest's
      # system python3 is PEP 668-managed and refuses that with
      # externally-managed-environment — the same trap build-ios.yml hit on
      # macos-14. This is the *host* interpreter driving cibuildwheel, not the
      # cp314 Android target being cross-built.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show pinned inputs
        run: |
          echo "Building ${{ inputs.target }} for ${{ matrix.abi }}"
          cat recipes/PINNED_REFS.toml

      # Kivy's setup.py shells out during the build, and cibuildwheel's
      # cross-build interpreter IS Android CPython, which looks for Android's
      # shell path on this Linux host. Without this the build dies with
      # FileNotFoundError: '/system/bin/sh'.
      - name: Provide /system/bin/sh
        run: sudo mkdir -p /system/bin && sudo ln -sf /bin/sh /system/bin/sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK r27.3.13750724
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      # The Kivy recipe links against the SDL2 line and grafts it into the
      # wheel, and each job starts on a clean runner — so it has to be built
      # here, in the same job. (The recipe checks for it and fails with that
      # instruction rather than a confusing compile error.)
      - name: Build SDL2 first
        if: inputs.target == 'kivy-2.3.1-sdl2'
        run: bash recipes/android/sdl2.sh ${{ matrix.abi }}

      - name: Assemble SDL3 first
        if: inputs.target == 'kivy-3.0-sdl3'
        run: bash recipes/android/sdl3.sh ${{ matrix.abi }}

      - name: Run recipe
        run: bash recipes/android/${{ inputs.target }}.sh ${{ matrix.abi }}

      # Each SDL recipe writes its Java glue from the same verified artifact
      # that produced the library — the tarball for SDL2, the .aar for SDL3.
      # If that differs from what is committed, the two have drifted, which
      # on-device means a black screen with nothing in logcat.
      #
      # `git status --porcelain`, not `git diff`: diff only reports tracked
      # files, so before the glue was committed this check passed on an empty
      # comparison and proved nothing. Untracked output here means the recipe
      # extracted a version that is not in the repo.
      #
      # Runs for any target whose job ran an SDL recipe, including the Kivy
      # ones that build their SDL line as a dependency.
      - name: SDL glue matches the committed copy
        if: >-
          inputs.target == 'sdl2' || inputs.target == 'kivy-2.3.1-sdl2' ||
          inputs.target == 'sdl3' || inputs.target == 'kivy-3.0-sdl3'
        run: |
          changes="$(git status --porcelain -- recipes/android/sdl-glue recipes/android/sdl-glue-sdl3)"
          if [[ -n "$changes" ]]; then
            echo "::error::sdl-glue differs from the pinned tarball extraction."
            echo "$changes"
            git diff -- recipes/android/sdl-glue recipes/android/sdl-glue-sdl3 | head -50
            exit 1
          fi
          tracked="$(git ls-files recipes/android/sdl-glue recipes/android/sdl-glue-sdl3 | wc -l)"
          if [[ "$tracked" -eq 0 ]]; then
            echo "::error::no glue is committed, so this check verifies nothing."
            exit 1
          fi
          echo "glue matches ($tracked files)"

      # sdl2 and sdl3 assemble native dependencies for the Kivy recipes; they
      # produce no wheels, and if-no-files-found: error would fail the job.
      - uses: actions/upload-artifact@v7
        if: inputs.target != 'sdl2' && inputs.target != 'sdl3'
        with:
          name: ${{ inputs.target }}-${{ matrix.abi }}
          path: .build/android/wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: build
    if: >-
      inputs.publish && inputs.target != 'sdl2' && inputs.target != 'sdl3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ inputs.target }}-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl | tee SHA256SUMS

      # Tag and title come from the wheels themselves, so a version bump needs no
      # workflow edit and the tag cannot disagree with what is inside it.
      - name: Derive release identity
        id: identity
        run: |
          cd dist
          wheel="$(ls -1 *.whl | head -1)"
          project="$(echo "$wheel" | cut -d- -f1 | tr '[:upper:]' '[:lower:]')"
          version="$(echo "$wheel" | cut -d- -f2)"
          case "${{ inputs.target }}" in
            kivy-2.3.1-sdl2) title="Kivy $version — Android (SDL2)" ;;
            kivy-3.0-sdl3)   title="Kivy $version — Android (SDL3)" ;;
            pyjnius)         title="pyjnius $version — Android" ;;
            *)               title="$project $version — Android" ;;
          esac
          # PEP 440 pre-release/dev markers; upstream Kivy 3.0 is unreleased.
          prerelease=""
          if [[ "$version" =~ (a|b|rc|dev) ]]; then
            prerelease="--prerelease"
          fi
          {
            echo "tag=$project-android-$version"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$project-android-$version title=$title $prerelease"

      # Assets are append-only by default. Replacing a published wheel changes
      # its sha256, and the whole reason this index exists is that consumers pin
      # those hashes in a lock file — so overwriting one silently breaks every
      # project that already locked it. Opting in is a separate, deliberate flag.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          notes="$(printf 'Built by [%s](%s/%s/actions/runs/%s) from `%s`.\n\nPinned inputs:\n\n```toml\n%s\n```\n' \
            "${{ github.workflow }}" "${{ github.server_url }}" "${{ github.repository }}" \
            "${{ github.run_id }}" "${{ github.sha }}" "$(cat recipes/PINNED_REFS.toml)")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists."
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if [[ "${{ inputs.replace_assets }}" != "true" ]]; then
              for wheel in dist/*.whl; do
                if grep -qxF "$(basename "$wheel")" <<<"$existing"; then
                  echo "::error::$(basename "$wheel") is already published. Re-uploading"
                  echo "::error::would change its sha256 and break existing lock files."
                  echo "::error::Re-run with replace_assets if that is intended."
                  exit 1
                fi
              done
            fi
            # SHA256SUMS has to describe every asset on the release, not just the
            # ones this run built: generate_index.py falls back to it whenever the
            # API reports no digest, and a wheel with no recoverable hash is
            # skipped rather than published. Adding one ABI must not erase the
            # other's line.
            if grep -qxF SHA256SUMS <<<"$existing"; then
              gh release download "$TAG" --pattern SHA256SUMS --dir prev --clobber
              awk 'NR==FNR { seen[$2] = 1; print; next } !($2 in seen)' \
                dist/SHA256SUMS prev/SHA256SUMS > merged
              mv merged dist/SHA256SUMS
              echo "Merged with the published SHA256SUMS:"
              cat dist/SHA256SUMS
            fi
          else
            gh release create "$TAG" \
              --title "${{ steps.identity.outputs.title }}" \
              --notes "$notes" \
              ${{ steps.identity.outputs.prerelease }}
          fi

          gh release upload "$TAG" dist/*.whl dist/SHA256SUMS --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  index:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-index.yml
