# Android wheel builds.
#
# Manual dispatch only: these builds are slow and their inputs change rarely,
# so there is nothing useful to trigger on push.
name: build-android

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which recipe to build
        required: true
        type: choice
        options: [sdl2, sdl3, kivy-2.3.1-sdl2, kivy-3.0-sdl3, pyjnius]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7

      # The recipes `pip install` cibuildwheel and Cython. ubuntu-latest's
      # system python3 is PEP 668-managed and refuses that with
      # externally-managed-environment — the same trap build-ios.yml hit on
      # macos-14. This is the *host* interpreter driving cibuildwheel, not the
      # cp314 Android target being cross-built.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show pinned inputs
        run: |
          echo "Building ${{ inputs.target }} for ${{ matrix.abi }}"
          cat recipes/PINNED_REFS.toml

      # Kivy's setup.py shells out during the build, and cibuildwheel's
      # cross-build interpreter IS Android CPython, which looks for Android's
      # shell path on this Linux host. Without this the build dies with
      # FileNotFoundError: '/system/bin/sh'.
      - name: Provide /system/bin/sh
        run: sudo mkdir -p /system/bin && sudo ln -sf /bin/sh /system/bin/sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK r27.3.13750724
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.3.13750724" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      # The Kivy recipe links against the SDL2 line and grafts it into the
      # wheel, and each job starts on a clean runner — so it has to be built
      # here, in the same job. (The recipe checks for it and fails with that
      # instruction rather than a confusing compile error.)
      - name: Build SDL2 first
        if: inputs.target == 'kivy-2.3.1-sdl2'
        run: bash recipes/android/sdl2.sh ${{ matrix.abi }}

      - name: Assemble SDL3 first
        if: inputs.target == 'kivy-3.0-sdl3'
        run: bash recipes/android/sdl3.sh ${{ matrix.abi }}

      - name: Run recipe
        run: bash recipes/android/${{ inputs.target }}.sh ${{ matrix.abi }}

      # Each SDL recipe writes its Java glue from the same verified artifact
      # that produced the library — the tarball for SDL2, the .aar for SDL3.
      # If that differs from what is committed, the two have drifted, which
      # on-device means a black screen with nothing in logcat.
      #
      # `git status --porcelain`, not `git diff`: diff only reports tracked
      # files, so before the glue was committed this check passed on an empty
      # comparison and proved nothing. Untracked output here means the recipe
      # extracted a version that is not in the repo.
      #
      # Runs for any target whose job ran an SDL recipe, including the Kivy
      # ones that build their SDL line as a dependency.
      - name: SDL glue matches the committed copy
        if: >-
          inputs.target == 'sdl2' || inputs.target == 'kivy-2.3.1-sdl2' ||
          inputs.target == 'sdl3' || inputs.target == 'kivy-3.0-sdl3'
        run: |
          changes="$(git status --porcelain -- recipes/android/sdl-glue recipes/android/sdl-glue-sdl3)"
          if [[ -n "$changes" ]]; then
            echo "::error::sdl-glue differs from the pinned tarball extraction."
            echo "$changes"
            git diff -- recipes/android/sdl-glue recipes/android/sdl-glue-sdl3 | head -50
            exit 1
          fi
          tracked="$(git ls-files recipes/android/sdl-glue recipes/android/sdl-glue-sdl3 | wc -l)"
          if [[ "$tracked" -eq 0 ]]; then
            echo "::error::no glue is committed, so this check verifies nothing."
            exit 1
          fi
          echo "glue matches ($tracked files)"

      # sdl2 and sdl3 assemble native dependencies for the Kivy recipes; they
      # produce no wheels, and if-no-files-found: error would fail the job.
      - uses: actions/upload-artifact@v7
        if: inputs.target != 'sdl2' && inputs.target != 'sdl3'
        with:
          name: ${{ inputs.target }}-${{ matrix.abi }}
          path: .build/android/wheelhouse/*.whl
          if-no-files-found: error
