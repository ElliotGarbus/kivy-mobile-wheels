# Regenerate the PEP 503 index from published release assets and deploy it to
# Pages.
#
# Triggered by release publication rather than push: the index describes what
# has been released, so releases are the only thing that can change it.
name: publish-index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python index-gen/generate_index.py --output public/simple

      # A bare directory listing at the root is unhelpful to anyone who lands
      # here from a lock file; point them at the index and at what this is for.
      - name: Landing page
        run: |
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>kivy-mobile-wheels</title></head>
          <body>
          <h1>kivy-mobile-wheels</h1>
          <p>A PEP 503 index of Android and iOS wheels for Kivy, pyjnius and
          pyobjus, built for
          <a href="https://github.com/ElliotGarbus/kivyforge">kivyforge</a>
          development.</p>
          <pre>extra_index_urls = ["https://elliotgarbus.github.io/kivy-mobile-wheels/simple/"]</pre>
          <p><a href="simple/">Browse the index</a> &middot;
          <a href="https://github.com/ElliotGarbus/kivy-mobile-wheels">Source</a></p>
          <p><strong>This is a bridge.</strong> It is retired once these
          projects publish mobile wheels to PyPI themselves.</p>
          </body></html>
          HTML

      - name: Show what will be published
        run: find public -name '*.html' | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
