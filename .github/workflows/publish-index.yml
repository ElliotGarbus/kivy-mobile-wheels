# Regenerate the PEP 503 index from published release assets, deploy it to
# Pages, and prove a consumer can actually resolve what was deployed.
#
# NOT triggered by `release: [published]`, though that is the obvious choice and
# was how this started. The `github-pages` environment restricts deployments to
# branch `main`, and a release event runs on the tag ref — so `build-index`
# would pass and `deploy` was rejected before its first step, silently, on every
# release. The index only ever updated because someone noticed and dispatched it
# by hand.
#
# Instead the build workflows call this at the end of a successful publish. They
# run on `main`, so the environment permits the deployment, and index publication
# stops being a step a human has to remember.
name: publish-index

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python index-gen/generate_index.py --output public/simple

      # A bare directory listing at the root is unhelpful to anyone who lands
      # here from a lock file; point them at the index and at what this is for.
      - name: Landing page
        run: |
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>kivy-mobile-wheels</title></head>
          <body>
          <h1>kivy-mobile-wheels</h1>
          <p>A PEP 503 index of Android and iOS wheels for Kivy, pyjnius and
          pyobjus, built for
          <a href="https://github.com/ElliotGarbus/kivyforge">kivyforge</a>
          development.</p>
          <pre>extra_index_urls = ["https://elliotgarbus.github.io/kivy-mobile-wheels/simple/"]</pre>
          <p><a href="simple/">Browse the index</a> &middot;
          <a href="https://github.com/ElliotGarbus/kivy-mobile-wheels">Source</a></p>
          <p><strong>This is a bridge.</strong> It is retired once these
          projects publish mobile wheels to PyPI themselves.</p>
          </body></html>
          HTML

      - name: Show what will be published
        run: find public -name '*.html' | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Deploying proves the HTML exists, not that pip can use it. A wrong platform
  # tag, a hash that no longer matches its asset, or a name that normalizes
  # differently all produce an index that looks fine and fails at `kivyforge
  # lock` — for the consumer, not here. So resolve every wheel the index
  # advertises, the same way a consumer would.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve every published wheel with pip
        run: |
          python index-gen/verify_index.py \
            --base-url "${{ needs.deploy.outputs.page_url }}"
