# Exact upstream commits each recipe builds from.
#
# Bumping any of these is a deliberate, reviewed commit to this file. Recipes
# MUST read the commit from here and MUST NOT default to a branch name: a
# release rebuilt next month has to produce the same inputs as one built today,
# and a branch HEAD silently does not.
#
# `ref` records which branch/tag the commit was taken from, for context only.
# It is never what gets checked out.
#
# Recipes NOT listed here are pinned by construction — they build from a
# versioned release tarball or PyPI sdist with a recorded SHA-256, which is a
# stronger pin than a git commit. That covers Android SDL2 (2.32.10 and its
# three satellites) and Kivy 2.3.1.
#
# Resolved 2026-10-25 via `git ls-remote <repo> <ref>`.
#
# pyjnius used to be pinned here. It now publishes Android wheels on PyPI, so
# the pin and recipe live under archive/pyjnius/ and are not built or indexed.

[ios.kivy]
repo = "https://github.com/kivy/kivy"
ref = "master"
commit = "27e458af2c95196a0c292f246b4b18b4067af230"
note = """
Kivy 3.0 pre-release; unreleased, so pinned by commit. Dated 2026-10-25.

Bumped from 56baa54 (2026-10-05) when CPython 3.15.0 final was released, so
the iOS wheels are rebuilt on it (the previous ones were built on 3.15.0b4,
which predates the ABI freeze). Picks up kivy#9441 — iOS keyboard height and
safe area reported in layout pixels — and kivy#9440, the SDL3
Window.screenshot() segfault.

**iOS is not yet simulator- or device-validated at this pin.** The last
simulator-validated pin is the 2026-06-22 commit.

Deliberately NOT floating on master. Each bump is a reviewed change to this
file (watch-upstream.yml opens the PR; a human merges it). Recipes stamp the
version to 3.0.0.dev<YYYYMMDDHHMM> from the commit date, so a new build gets
its own release and old lock files keep resolving to the bytes they pinned.
Re-validate on a device or the simulator after merging a bump that matters.

Switch to a versioned sdist and delete this entry once 3.0 is tagged — a
release tarball + SHA-256 is a stronger pin than a commit.
"""

[ios.pyobjus]
repo = "https://github.com/kivy/pyobjus"
ref = "master"
commit = "15c58cb3ee5cad5c1f4e78ecf3b825494c941408"
note = """
master HEAD on 2026-10-25, 24 commits past v1.2.4 (0c229e7, the previous
pin). Bumped when CPython 3.15.0 final was released, to rebuild on it and to
pick up the iOS fixes since the tag: frameworks loaded with dlopen on iOS
(#158), struct by-value heap overrun (#157), nested-struct make_type (#163),
and str selector names in autoclass (#159).

Upstream still declares 1.2.4 here, so the recipe stamps it
1.2.5.dev<YYYYMMDDHHMM> from the commit date — see
recipes/lib/stamp_pyobjus_version.py. A dev version is only selected by a
requirement that opts in, e.g. pyobjus>=1.2.5.dev0. Pin a tag again, and
the stamp steps aside, once upstream releases 1.2.5.

Upstream PR #105 (Obj-C protocol loading rework, flagged "DO NOT MERGE
YET") was still open and unmerged at this commit. Re-check that before
bumping again.

pyobjus has no iOS CI upstream, so this build path is not upstream-validated.
"""

# Kivy 3.0 for Android. Same source as the iOS build today, but kept as its own
# entry so the two platforms can move independently — an Android-only SDL3
# problem should not force an iOS rebuild.
[android.kivy]
repo = "https://github.com/kivy/kivy"
ref = "master"
commit = "27e458af2c95196a0c292f246b4b18b4067af230"
note = """
Kivy 3.0 pre-release; unreleased, so pinned by commit. Kept in step with
[ios.kivy] deliberately — same tree, same stamped version. watch-upstream.yml
rewrites both commit lines together; do not split them without also changing
how stamp_kivy_version.py predicts the release tag.

**Not yet validated at 27e458a (2026-10-25).** Bumped together with
[ios.kivy] for the CPython 3.15.0 final rebuild of the iOS wheels. The
validation below is for 56baa54.

56baa54 was bumped from 71407bc (2026-07-30) together with building SDL3_ttf with
HarfBuzz, which fixes blank icon-font glyphs (kivyforge#96,
SDL3-FINDINGS.md §5). The recipe change alone would have rebuilt the same
version, which the append-only guard rightly refuses.

**Validated at this pin (2026-10-08), arm64_v8a only**, on an API-35 arm64
emulator with the wheels from build-android run 37766763368 (publish off):
the #96 reproducer draws both Material Design Icons glyphs, and
android-safe-area renders its text and reports real insets. x86_64 built
and passed CI's static gates but was not launched (Apple Silicon host).
71407bc was validated on 2026-07-31 on both ABIs (x86_64 API-36 emulator,
arm64_v8a Pixel 8a). Insets arrive in **pixels** on Android (UIKit points
on iOS), although kivy/mobile/__init__.py documents "layout points" for
both without the per-platform caveat.

Its setup.py resolves Android SDL3 from <cwd>/dist/libs/<abi> and
<cwd>/dist/include, using os.getcwd() rather than KIVY_DEPS_ROOT, so the
recipe must assemble that tree inside the Kivy source. See SDL3-FINDINGS.md.
"""
