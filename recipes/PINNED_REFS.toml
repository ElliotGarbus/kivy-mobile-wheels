# Exact upstream commits each recipe builds from.
#
# Bumping any of these is a deliberate, reviewed commit to this file. Recipes
# MUST read the commit from here and MUST NOT default to a branch name: a
# release rebuilt next month has to produce the same inputs as one built today,
# and a branch HEAD silently does not.
#
# `ref` records which branch/tag the commit was taken from, for context only.
# It is never what gets checked out.
#
# Recipes NOT listed here are pinned by construction — they build from a
# versioned release tarball or PyPI sdist with a recorded SHA-256, which is a
# stronger pin than a git commit. That covers Android SDL2 (2.32.10 and its
# three satellites) and Kivy 2.3.1.
#
# Resolved 2026-07-26 via `git ls-remote <repo> <ref>`.

[android.pyjnius]
repo = "https://github.com/ElliotGarbus/pyjnius"
ref = "spike/android-universal-wheel"
commit = "0342053c74785c2833586aa8e97527a209bda48c"
note = """
Not merged upstream. Verified 2026-07-26: this branch is 20 commits ahead of
kivy/pyjnius@master and 0 behind, carrying the Android wheel work
(.github/workflows/android-wheels.yml, jnius/jnius_jvm_android.pxi,
pyproject.toml, setup.py). kivy/pyjnius has no Android wheel CI.

Re-check before bumping: if this lands upstream, repoint `repo` at
kivy/pyjnius rather than advancing this fork.
"""

[ios.kivy]
repo = "https://github.com/kivy/kivy"
ref = "master"
commit = "a933f859b4d0add7267798ffba5abb1a456da7f4"
note = """
This is the commit that actually built the vendored iOS Kivy wheels currently
running on the simulator — recovered from the cached checkout under
.build/ios-wheels/kivy on the build Mac, not inferred (kivyforge
docs/design/dev/mobile-wheels-phase0-inventory.md). Dated 2026-06-22.

Deliberately NOT master HEAD. Pinning HEAD would rebuild wheels nobody has run
and invalidate the sha256s already committed in
examples/mobile/hello-kivy/pylock.ios.toml, forcing a re-lock and a fresh
round of device validation for no gain. Bump this when there is a reason to,
and re-validate when you do.

Kivy 3.0 pre-release. Switch to a versioned sdist and delete this entry once
3.0 is tagged — a release tarball + SHA-256 is a stronger pin than a commit.
"""

[ios.pyobjus]
repo = "https://github.com/kivy/pyobjus"
ref = "master"
commit = "0c229e75248c14652b6764db5730eeb30bab95ed"
note = """
As above: the commit that actually built the vendored pyobjus iOS wheels,
recovered from the cached checkout, dated 2025-12-29. Not master HEAD.

master deliberately avoids upstream PR #105 (Obj-C protocol loading rework),
which is flagged "DO NOT MERGE YET". Re-check that this is still true before
ever bumping this pin.

pyobjus has no iOS CI upstream, so this build path is not upstream-validated.
"""

# Kivy 3.0 for Android. Same source as the iOS build today, but kept as its own
# entry so the two platforms can move independently — an Android-only SDL3
# problem should not force an iOS rebuild.
[android.kivy]
repo = "https://github.com/kivy/kivy"
ref = "master"
commit = "a933f859b4d0add7267798ffba5abb1a456da7f4"
note = """
Kivy 3.0 pre-release; unreleased, so pinned by commit. Kept in step with
[ios.kivy] deliberately — same tree, validated on iOS.

Its setup.py resolves Android SDL3 from <cwd>/dist/libs/<abi> and
<cwd>/dist/include, using os.getcwd() rather than KIVY_DEPS_ROOT, so the
recipe must assemble that tree inside the Kivy source. See SDL3-FINDINGS.md.
"""
